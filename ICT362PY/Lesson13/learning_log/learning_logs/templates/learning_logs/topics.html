{% extends 'learning_logs/base.html' %}

{% block content %}

  <div style="max-width: 700px; margin: 40px auto; font-family: Arial, sans-serif;">

    <h1 style="font-size: 36px; margin-bottom: 10px;">
      Learning Log Topics
    </h1>

    <p style="font-size: 18px; color: #555;">
      Choose a topic below to view what I am learning.
    </p>

    <hr>

    <ul style="font-size: 22px; line-height: 2;">
      {% for topic in topics %}
        <li>
          <a href="{% url 'learning_logs:topic' topic.id %}">
            {{ topic.text }}
          </a>
        </li>
      {% empty %}
        <li>No topics have been added yet.</li>
      {% endfor %}
    </ul>

  </div>

{% endblock content %}
